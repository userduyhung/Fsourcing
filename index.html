<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Preload only Noto Sans (Vietnamese) to prioritize Vietnamese glyphs and reduce payload -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap&subset=vietnamese" onload="this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap&subset=vietnamese" rel="stylesheet">
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fsourcing - Global B2B Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Optional runtime env file: create /env.js on your host to set window.__API_BASE or window.__ENV -->
    <script>
      // Dynamically load optional runtime env file (served from host) before the app
      (function(){
        try {
          var s = document.createElement('script');
          s.src = '/env.js';
          s.async = false; // preserve execution order
          document.head.appendChild(s);
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
